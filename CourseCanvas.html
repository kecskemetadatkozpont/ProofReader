<!DOCTYPE html>
<html lang="hu">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Publify — Évfolyam-vászon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --surface:#fff; --surface-2:#f2f4f8; --surface-3:#e9ecf4; --accent-tint:#eef0ff; --ok:#15803d; --ok-bg:#e7f6ee; --warn:#b45309; --warn-bg:#fbf1dd; --danger:#b42318; --danger-bg:#fdeef0;
      --accent:#4f46e5; --accent-d:#4338ca; --ink:#1a2030; --muted:#5b6473; --faint:#8a92a0; --line:#e4e7ef; --line-2:#d7dbe8; --soft:#f5f6f9; --softer:#f7f8fb; --canvas-bg:#f6f7fb; }
    /* theme.js overrides the shared tokens under html.dark — --canvas-bg is page-local, so cover it here */
    html.dark { --canvas-bg:#0c0f18; --line-2:#323848; }
    * { box-sizing:border-box; }
    html,body { margin:0; height:100%; overflow:hidden; }
    body { background:var(--softer); color:var(--ink); font-family:'IBM Plex Sans',system-ui,sans-serif; -webkit-font-smoothing:antialiased; font-size:14px; line-height:1.45; }
    a { color:var(--accent); text-decoration:none; }
    .mk { width:26px; height:26px; border-radius:8px; display:grid; place-items:center; background:linear-gradient(135deg,#6366f1,#d946ef); box-shadow:0 3px 10px rgba(79,70,229,.34); flex:none; }
    .mk i { width:9px; height:9px; border-top:2px solid #fff; border-left:2px solid #fff; border-radius:2px 0 0 0; transform:rotate(45deg); margin-top:2px; }
    .btn { display:inline-flex; align-items:center; gap:7px; height:34px; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:10px; padding:0 13px; font-family:inherit; font-size:13px; font-weight:600; cursor:pointer; text-decoration:none; }
    .btn:hover { border-color:var(--line-2); }
    .btn.pri { background:var(--accent); border-color:var(--accent); color:#fff; }
    .btn.pri:hover { background:var(--accent-d); }
    .btn.ic { width:34px; padding:0; justify-content:center; font-size:15px; flex:none; }
    .btn.sm { height:28px; padding:0 10px; font-size:12px; border-radius:8px; }

    .center { height:100vh; display:flex; align-items:center; justify-content:center; }
    .center .box { text-align:center; max-width:460px; padding:0 18px; } .center .mk { width:52px; height:52px; margin:0 auto 16px; } .center .mk i { width:17px; height:17px; }
    .center h1 { font-size:20px; margin:0 0 6px; } .center p { font-size:13.5px; color:var(--muted); margin:0 0 20px; }

    .app { display:grid; grid-template-rows:auto auto auto 1fr; grid-template-columns:1fr 260px; height:100vh; }
    .topbar { grid-column:1 / 3; display:flex; align-items:center; gap:13px; height:54px; padding:0 18px; background:var(--surface); border-bottom:1px solid var(--line); z-index:20; }
    .brand { display:flex; align-items:center; gap:9px; font-weight:700; letter-spacing:-.2px; color:var(--ink); }
    .brand small { display:block; font-size:10.5px; font-weight:600; color:var(--faint); }
    .crumb { font-size:12.5px; font-weight:600; color:var(--faint); position:relative; padding-left:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:26vw; }
    .crumb::before { content:'/'; position:absolute; left:3px; color:var(--line-2); }
    .spring { flex:1; }
    .tstat { font-size:12.5px; color:var(--muted); display:flex; align-items:center; gap:7px; } .tstat b { color:var(--ink); font-weight:700; }
    .dot { width:8px; height:8px; border-radius:50%; display:inline-block; }

    /* lecture tabs (mockup screen 2, tokenised) */
    .cvtop { grid-column:1 / 3; display:flex; align-items:center; gap:10px; padding:8px 14px; background:var(--surface); border-bottom:1px solid var(--line); }
    .lect-tabs { display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; }
    .lect-tabs::-webkit-scrollbar { display:none; }
    .lect-tabs span { font-size:11.5px; font-weight:700; color:var(--faint); border:1px solid var(--line); border-radius:8px; padding:4px 9px; background:var(--surface-2); white-space:nowrap; font-variant-numeric:tabular-nums; cursor:pointer; }
    .lect-tabs span:hover { color:var(--ink); }
    .lect-tabs span.on { color:#fff; background:linear-gradient(135deg,#6366f1,#a855f7); border-color:transparent; }

    /* poll bar (voting / results) */
    .pollbar { grid-column:1 / 3; display:flex; align-items:center; gap:10px; padding:8px 14px; font-size:12.5px; color:var(--ink); background:linear-gradient(90deg,var(--accent-tint),var(--surface)); border-bottom:1px solid var(--line); }
    .pollbar.off { display:none; }
    .pollbar .pb-ico { font-size:15px; flex:none; }
    .pollbar .pb-t { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .pollbar .pb-t b { font-weight:700; }

    .canvas { grid-row:4; grid-column:1; position:relative; overflow:hidden; background:var(--canvas-bg);
      background-image:radial-gradient(circle, var(--line-2) 1px, transparent 1px); background-size:26px 26px; cursor:default; }
    .canvas.grab { cursor:grabbing; }
    .world { position:absolute; top:0; left:0; transform-origin:0 0; will-change:transform; }
    .cc-empty { position:absolute; left:40px; top:40px; width:460px; background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:0 8px 26px rgba(20,26,40,.07); padding:26px 24px; }
    .cc-empty b { font-size:14px; }
    .cc-empty div { font-size:12.5px; color:var(--muted); margin-top:8px; line-height:1.5; }

    /* flip cards (mockup .cv-card, tokenised) */
    .cv-card { position:absolute; cursor:pointer; perspective:900px; }
    .cv-card:focus-visible { outline:2px solid var(--accent); outline-offset:3px; border-radius:14px; }
    .cv-card .inner { position:relative; transform-style:preserve-3d; transition:transform .5s; }
    @media (prefers-reduced-motion:reduce) { .cv-card .inner { transition:none; } }
    .cv-card.flip .inner { transform:rotateY(180deg); }
    .cv-face { backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:13px; overflow:hidden; border:1px solid var(--line); background:var(--surface); box-shadow:0 10px 30px rgba(20,26,40,.12); }
    .cv-face.front:hover { border-color:var(--accent); }
    .cv-face.back { position:absolute; inset:0; transform:rotateY(180deg); display:flex; flex-direction:column; }
    .cv-card.pinned .cv-face.front { box-shadow:0 0 0 1.6px #a855f7, 0 14px 38px rgba(168,85,247,.35); }
    .cv-card.dim { opacity:.45; }
    .cv-card.dragging { z-index:8; } .cv-card.dragging .cv-face.front { box-shadow:0 18px 44px rgba(20,26,40,.28); }
    .cv-card.new { animation:ccslide .5s ease; }
    @keyframes ccslide { from { opacity:0; transform:translateY(-14px) scale(.96); } to { opacity:1; transform:none; } }
    @media (prefers-reduced-motion:reduce) { .cv-card.new, .lf-i.new { animation:none; } }

    .cv-thumb { position:relative; background:var(--surface-2); overflow:hidden; display:grid; place-items:center; }
    .cv-thumb img, .cv-thumb video { width:100%; height:100%; object-fit:cover; display:block; }
    .cv-thumb .ph { color:var(--faint); font-size:22px; }
    .cv-thumb.txt { grid-auto-rows:min-content; align-content:center; justify-items:center; gap:6px; padding:10px; text-align:center; }
    .cv-thumb.txt .big { font-size:22px; }
    .cv-thumb.txt .sm { font-size:11px; color:var(--muted); line-height:1.4; max-height:60px; overflow:hidden; overflow-wrap:anywhere; }
    .cv-thumb.txt .openl { font-size:11px; font-weight:700; }
    .playb { position:absolute; left:8px; bottom:8px; width:30px; height:30px; border-radius:50%; border:0; background:rgba(15,20,40,.65); color:#fff; cursor:pointer; font-size:12px; display:grid; place-items:center; }
    .playb:hover { background:rgba(15,20,40,.85); }
    .gaudio { background:linear-gradient(135deg,#132034,#0c1524); }
    .gaudio .wave { display:flex; align-items:flex-end; gap:2.5px; height:44px; }
    .gaudio .wave i { width:4px; border-radius:2px; background:linear-gradient(180deg,#6366f1,#a855f7,#22d3ee); }
    .cv-pin { position:absolute; top:6px; right:6px; font-size:10.5px; font-weight:700; background:rgba(15,20,40,.72); border-radius:6px; padding:2px 7px; color:#e9d5ff; z-index:2; }
    .medal { position:absolute; top:6px; left:6px; font-size:18px; filter:drop-shadow(0 2px 5px rgba(0,0,0,.4)); z-index:2; }
    .hidetag { position:absolute; bottom:6px; left:6px; font-size:10px; font-weight:700; background:rgba(15,20,40,.72); color:#fecaca; border-radius:6px; padding:2px 7px; z-index:2; }

    .cv-meta { padding:8px 10px; }
    .cv-meta .who { display:flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700; min-width:0; }
    .cv-meta .who .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
    .cv-av { width:16px; height:16px; border-radius:50%; flex:none; background:var(--surface-3); object-fit:cover; }
    .lchip { margin-left:auto; flex:none; font-size:10px; font-weight:700; color:var(--faint); border:1px solid var(--line); border-radius:6px; padding:1px 6px; background:var(--surface-2); white-space:nowrap; }
    .cv-meta .sub { display:flex; justify-content:space-between; align-items:center; gap:6px; font-size:10.5px; color:var(--muted); margin-top:5px; min-width:0; }
    .cv-meta .sub .mdl { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
    .rxrow { display:flex; gap:4px; align-items:center; flex:none; }
    .rxb, .vbtn { border:1px solid var(--line); background:var(--surface); color:var(--muted); border-radius:999px; padding:1px 7px; font-size:10.5px; font-weight:650; cursor:pointer; font-family:inherit; white-space:nowrap; }
    .rxb:hover, .vbtn:hover { border-color:var(--accent); }
    .rxb.on { background:var(--accent-tint); border-color:var(--accent); color:var(--accent); }
    .vbtn { color:var(--warn); border-color:color-mix(in srgb,var(--warn) 40%,var(--line)); font-variant-numeric:tabular-nums; }
    .vbtn.on { background:var(--warn-bg); border-color:var(--warn); font-weight:800; }
    .vbtn.off { opacity:.45; cursor:not-allowed; }
    .vbtn.done { cursor:default; background:var(--warn-bg); border-color:transparent; }

    /* provenance back face */
    .cv-face.back .bh { font-size:10px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); padding:9px 11px 0; flex:none; }
    .cv-face.back .bp { flex:1; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10.5px; line-height:1.5; color:var(--ink); padding:6px 11px; overflow:auto; overflow-wrap:anywhere; }
    .bp .neg { color:var(--danger); }
    .cv-face.back .bm { padding:7px 10px; border-top:1px solid var(--line); display:flex; gap:5px; flex-wrap:wrap; flex:none; }
    .pchip { font-size:10px; font-weight:650; padding:1px 7px; border-radius:6px; background:var(--surface-2); color:var(--muted); border:1px solid var(--line); max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .pchip.acc { background:var(--accent-tint); color:var(--accent-d); border-color:transparent; }
    .pchip.warn { background:var(--warn-bg); color:var(--warn); border-color:transparent; }

    .hintbar { position:absolute; left:16px; bottom:14px; font-size:11.5px; color:var(--muted); background:color-mix(in srgb,var(--surface) 88%,transparent); backdrop-filter:blur(6px); border:1px solid var(--line); border-radius:999px; padding:6px 13px; z-index:5; }
    .zoom { position:absolute; right:16px; bottom:14px; display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden; box-shadow:0 6px 18px rgba(20,26,40,.1); z-index:5; }
    .zoom button { width:38px; height:36px; border:0; background:var(--surface); color:var(--ink); font-size:16px; cursor:pointer; } .zoom button:hover { background:var(--surface-2); }
    .zoom .lvl { font-size:10.5px; text-align:center; color:var(--faint); border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:4px 0; font-variant-numeric:tabular-nums; }

    /* live feed (mockup .livefeed, tokenised) */
    .livefeed { grid-row:4; grid-column:2; border-left:1px solid var(--line); background:var(--surface); display:flex; flex-direction:column; min-height:0; }
    .lf-h { display:flex; align-items:center; gap:7px; padding:11px 13px; border-bottom:1px solid var(--line); font-size:12px; font-weight:800; }
    .lf-h .live { width:7px; height:7px; border-radius:50%; background:var(--danger); animation:ccpulse 1.6s infinite; }
    @keyframes ccpulse { 0%,100% { box-shadow:0 0 0 0 rgba(248,113,113,.5); } 50% { box-shadow:0 0 0 6px rgba(248,113,113,0); } }
    @media (prefers-reduced-motion:reduce) { .lf-h .live { animation:none; } }
    .lf-b { flex:1; overflow-y:auto; padding:9px; }
    .lf-i { display:flex; gap:8px; padding:7px 6px; border-radius:9px; font-size:11.5px; color:var(--muted); line-height:1.45; }
    .lf-i:hover { background:var(--surface-2); }
    .lf-i b { color:var(--ink); }
    .lf-i .t { color:var(--faint); font-size:10.5px; font-variant-numeric:tabular-nums; flex:none; margin-top:1px; }
    .lf-i.new { animation:ccslide .45s ease; }

    /* context menu (instructor moderation / own delete) */
    .cmenu { position:fixed; z-index:70; min-width:220px; background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:0 14px 40px rgba(15,20,40,.25); padding:5px; }
    .cmenu button { display:flex; width:100%; align-items:center; gap:9px; border:0; background:transparent; color:var(--ink); font-family:inherit; font-size:12.5px; font-weight:600; padding:8px 10px; border-radius:8px; cursor:pointer; text-align:left; }
    .cmenu button:hover { background:var(--surface-2); }
    .cmenu button.danger { color:var(--danger); }

    /* dialog (new poll / results) */
    .cc-scrim { position:fixed; inset:0; background:rgba(15,20,40,.42); z-index:80; display:grid; place-items:center; padding:20px; }
    .cc-dlg { width:min(440px,94vw); background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:0 24px 60px rgba(15,20,40,.3); padding:18px 20px; max-height:84vh; overflow-y:auto; }
    .cc-dlg h3 { margin:0 0 12px; font-size:15px; }
    .cc-dlg label { display:block; font-size:11.5px; font-weight:700; color:var(--muted); margin:10px 0 4px; }
    .cc-dlg input, .cc-dlg select { width:100%; font-family:inherit; font-size:13px; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:9px; padding:7px 10px; }
    .cc-dlg input:focus, .cc-dlg select:focus { outline:none; border-color:var(--accent); }
    .cc-dlg .row { display:flex; gap:9px; justify-content:flex-end; margin-top:16px; }
    .resrow { display:flex; align-items:center; gap:9px; padding:8px 0; border-bottom:1px solid var(--line); font-size:12.5px; }
    .resrow:last-of-type { border-bottom:0; }
    .resrow .rk { width:26px; text-align:center; font-size:15px; flex:none; }
    .resrow .ri { min-width:0; flex:1; } .resrow .ri b { display:block; }
    .resrow .ri span { display:block; font-size:11px; color:var(--faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .resrow .ri .vt i { font-style:italic; color:var(--faint); }
    .resrow .vn { font-weight:800; font-variant-numeric:tabular-nums; flex:none; }

    /* toast */
    .cc-toast { position:fixed; left:50%; bottom:26px; transform:translate(-50%,14px); background:var(--ink); color:#fff; font-size:13px; font-weight:600; padding:10px 16px; border-radius:11px; box-shadow:0 10px 30px rgba(15,20,40,.3); z-index:90; opacity:0; transition:opacity .22s, transform .22s; pointer-events:none; max-width:90vw; }
    html.dark .cc-toast { background:var(--surface-2); color:var(--ink); border:1px solid var(--line); }
    .cc-toast.show { opacity:1; transform:translate(-50%,0); }
    .cc-toast.err { background:var(--danger); color:#fff; }
    @media (prefers-reduced-motion:reduce) { .cc-toast { transition:none; } }

    @media (max-width:1000px) { .app { grid-template-columns:1fr; } .livefeed { display:none; } .canvas { grid-column:1; } .topbar, .cvtop, .pollbar { grid-column:1; } .topbar { flex-wrap:wrap; height:auto; padding:8px 12px; } }
  </style>
  <script src="theme.js?v=1789717870"></script>
</head>

<body>
  <div id="root">
    <div class="center"><div class="box"><div class="mk"><i></i></div><h1>Évfolyam-vászon</h1><p>Betöltés…</p></div></div>
  </div>

  <script src="auth.js?v=1789717870"></script>
  <script src="backend.js?v=1789717870"></script>
  <script src="course-canvas.js?v=1789717870"></script>

  <script src="build.js?v=1789717870"></script>
  <script src="version-badge.js?v=1789717870"></script>
</body>
