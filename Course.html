<!DOCTYPE html>
<html lang="hu">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Publify — Kurzus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --surface:#fff; --surface-2:#f5f6f9; --surface-3:#fafbfc; --accent-tint:#eef0ff; --ok:#15803d; --ok-bg:#e7f6ee; --warn:#b45309; --warn-bg:#fdf6e3; --danger:#b42318; --danger-bg:#fdeef0;
      --accent: #4f46e5; --accent-d: #4338ca; --ink: #1a2030; --muted: #5b6473; --faint: #8a92a0;
      --line: #e6e8ee; --soft: #f5f6f9; --softer: #fafbfc; --paper: #fff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { background: var(--softer); color: var(--ink); font-family: 'IBM Plex Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: var(--accent); text-decoration: none; }
    .mk { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: linear-gradient(135deg, #6366f1, #d946ef); box-shadow: 0 4px 12px rgba(79,70,229,.34); flex: none; }
    .mk span { width: 12px; height: 12px; border-top: 2.4px solid #fff; border-left: 2.4px solid #fff; border-radius: 2px 0 0 0; transform: rotate(45deg); margin-top: 3px; }
    .center { min-height: 80vh; display: flex; align-items: center; justify-content: center; }
    .center .box { text-align: center; max-width: 440px; padding: 0 18px; } .center .mk { width: 52px; height: 52px; margin: 0 auto 16px; }
    .center h1 { font-size: 20px; margin: 0 0 6px; } .center p { font-size: 13.5px; color: var(--muted); margin: 0 0 20px; line-height: 1.55; }
    .soon { background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; padding: 28px; text-align: center; color: var(--muted); line-height: 1.55; }
    .sp { flex: 1; }

    /* shared button / chip / segmented vocabulary (mirrors Kanban.html / Research.html) */
    .btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; font-family: inherit; font-size: 13px; font-weight: 600; color: var(--ink); cursor: pointer; white-space: nowrap; }
    .btn:hover { border-color: var(--accent); } .btn:disabled { opacity: .55; cursor: default; }
    .btn.pri { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn.sm { padding: 4px 10px; font-size: 12px; border-radius: 8px; }
    .btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 30%, transparent); }
    .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; background: var(--surface); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .chip.ok { color: var(--ok); background: var(--ok-bg); border-color: transparent; }
    .chip.warn { color: var(--warn); background: var(--warn-bg); border-color: transparent; }
    .chip.danger { color: var(--danger); background: var(--danger-bg); border-color: transparent; }
    .chip.acc { color: var(--accent); background: var(--accent-tint); border-color: transparent; }
    button.chip { cursor: pointer; font-family: inherit; }
    button.chip:hover { border-color: var(--accent); color: var(--accent); }
    .seg { display: inline-flex; background: var(--soft); border: 1px solid var(--line); border-radius: 10px; padding: 2px; flex-wrap: wrap; }
    .seg button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 12.5px; font-weight: 600; padding: 6px 12px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
    .seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(20,26,32,.08); }
    .in { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 9px; padding: 8px 10px; font: inherit; font-size: 13px; }
    .in:focus { outline: none; border-color: var(--accent); }
    textarea.in { resize: vertical; width: 100%; }
    .form-l { font-size: 11px; font-weight: 700; color: var(--faint); text-transform: uppercase; letter-spacing: .05em; margin: 8px 0 3px; }
    /* determinate progress bar fallback (theme.js also ships .pr-bar) */
    .pr-bar { height: 7px; border-radius: 999px; background: var(--soft); overflow: hidden; }
    .pr-bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .25s ease; }

    /* course home + management (create course, members) */
    .muted { color: var(--muted); }
    .in.sm { padding: 4px 8px; font-size: 12.5px; border-radius: 8px; }
    .home-h { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin: 6px 0 16px; }
    .home-h h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -.3px; }
    .home-h p { margin: 0; font-size: 13.5px; color: var(--muted); }
    .course-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .course-card { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 14px 16px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; min-height: 132px; transition: border-color .12s, box-shadow .12s; }
    .course-card:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); box-shadow: 0 8px 22px -14px rgba(20,24,40,.35); }
    .course-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .course-card.off { opacity: .7; }
    .cc-top { display: flex; gap: 6px; flex-wrap: wrap; min-height: 22px; }
    .cc-t { font-size: 15.5px; font-weight: 700; line-height: 1.3; letter-spacing: -.1px; text-wrap: balance; }
    .cc-d { font-size: 12.5px; color: var(--muted); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .cc-meta { margin-top: auto; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
    .join-card { max-width: 520px; }
    .join-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .join-row .in { flex: 1; min-width: 160px; }
    .join-code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 15px; font-weight: 700; letter-spacing: .08em; background: var(--soft); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; }
    .co-note { font-size: 12.5px; color: var(--muted); line-height: 1.5; margin: 6px 0 10px; }
    .co-err { font-size: 12.5px; color: var(--danger); margin: 8px 0 0; }
    .co-scrim { position: fixed; inset: 0; z-index: 1250; background: rgba(8,10,16,.45); display: flex; align-items: center; justify-content: center; padding: 16px; }
    .co-modal { width: min(560px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 30px 80px rgba(10,14,30,.35); display: flex; flex-direction: column; }
    .co-mh { display: flex; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); font-size: 15px; }
    .co-x { margin-left: auto; border: 0; background: var(--soft); color: var(--muted); width: 30px; height: 30px; border-radius: 8px; font-size: 18px; cursor: pointer; }
    .co-mb { padding: 14px 18px; display: flex; flex-direction: column; gap: 2px; }
    .co-mb .in { width: 100%; }
    .co-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    @media (max-width: 560px) { .co-row { grid-template-columns: 1fr; } }
    .co-mf { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); }
    .members { align-items: start; }
    .mem-col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
    .mem-table { padding-bottom: 2px; }
    .mem-h { display: flex; align-items: center; gap: 8px; padding: 11px 12px 4px; font-size: 13.5px; }
    .mem-empty { padding: 8px 12px 14px; font-size: 12.5px; color: var(--faint); }
    .mem-table td.act { text-align: right; }
    .mem-table td.cell-wrap { white-space: normal; min-width: 140px; }
    .mem-table tbody tr { cursor: default; }
    .add-card h3, .code-card h3 { margin: 0 0 8px; font-size: 14.5px; }
    .add-bar { display: flex; flex-direction: column; gap: 8px; }
    .add-bar .in { width: 100%; }
    .pick-list { display: flex; flex-direction: column; gap: 3px; max-height: 340px; overflow-y: auto; margin: 10px 0; }
    .pick-row { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 9px; border: 1px solid transparent; cursor: pointer; }
    .pick-row:hover { background: var(--soft); }
    .pick-row.on { background: var(--accent-tint); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
    .pick-row.dis { cursor: default; opacity: .75; }
    .pick-row input { width: 15px; height: 15px; margin: 0; accent-color: var(--accent); flex: none; }
    .pick-row:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 1px; }
    .pick-t { display: flex; flex-direction: column; min-width: 0; flex: 1; font-size: 13px; }
    .pick-t .muted { font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .add-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px; }

    /* ===== live lectures (course-live.js) ===== */
    .cl-spin { width: 13px; height: 13px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; display: inline-block; vertical-align: -2px; animation: clsp .7s linear infinite; }
    @keyframes clsp { to { transform: rotate(360deg); } }
    .cl-banner { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: color-mix(in srgb, var(--danger) 8%, var(--surface)); border: 1px solid color-mix(in srgb, var(--danger) 30%, var(--line)); border-radius: 12px; padding: 9px 14px; margin-bottom: 12px; font-size: 13.5px; }
    .cl-live-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--danger); box-shadow: 0 0 0 0 color-mix(in srgb, var(--danger) 60%, transparent); animation: clpulse 1.6s ease-out infinite; vertical-align: 1px; }
    @keyframes clpulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--danger) 55%, transparent); } 100% { box-shadow: 0 0 0 10px transparent; } }
    @media (prefers-reduced-motion: reduce) { .cl-live-dot, .cl-spin { animation: none; } }
    .cl-decks { display: flex; flex-direction: column; gap: 12px; }
    .cl-decks-h { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
    .cl-decks-h h3 { margin: 0 0 2px; font-size: 16px; }
    .cl-decks-h .co-note { margin: 0; max-width: 720px; }
    .cl-deck-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
    .cl-deck { display: flex; flex-direction: column; gap: 6px; }
    .cl-deck-t { font-size: 15px; font-weight: 700; line-height: 1.3; }
    .cl-deck-m { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
    .cl-pdfstage { display: grid; place-items: center; background: #fff; border-radius: 10px; overflow: hidden; }
    .cl-pdfstage.contain { height: 100%; background: #111; }
    .cl-pdfcanvas { display: block; max-width: 100%; }
    .cl-lectures { display: flex; flex-direction: column; gap: 12px; }
    .cl-lec { border: 1px solid var(--line, #262c3a); border-radius: 12px; padding: 10px; }
    .cl-lec.hidden { opacity: .72; border-style: dashed; }
    .cl-lec-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .cl-lec-h .sp { flex: 1; }
    .cl-lec-h .in.sm { width: 140px; }
    .cl-lec-n { color: var(--muted); font-variant-numeric: tabular-nums; }
    .cl-lec-empty { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 4px 2px; }
    .cl-newlec-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .cl-newlec-row .in { flex: 1; min-width: 220px; }
    .cl-newlec-row .in.sm { flex: none; width: 150px; }
    .cl-loose { margin-top: 12px; }
    .cl-deck-first { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cl-deck-a { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
    .cl-upload { display: flex; flex-direction: column; gap: 4px; max-width: 560px; }
    .cl-upload .in { width: 100%; }
    .cl-bar-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; margin-bottom: 10px; font-size: 13.5px; }
    .cl-title { max-width: 520px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cl-3col, .cl-pgrid { display: grid; grid-template-columns: 220px minmax(0, 1fr) 340px; gap: 12px; align-items: start; }
    .cl-sgrid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 12px; align-items: start; }
    .cl-bgrid { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 12px; align-items: start; }
    @media (max-width: 1180px) { .cl-3col, .cl-pgrid { grid-template-columns: 180px minmax(0, 1fr); } .cl-3col .cl-side, .cl-pgrid .cl-side { grid-column: 1 / -1; } }
    @media (max-width: 820px) { .cl-3col, .cl-pgrid, .cl-sgrid, .cl-bgrid { grid-template-columns: 1fr; } .cl-rail { max-height: 180px; } }
    .cl-rail { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 6px; max-height: calc(100vh - 170px); overflow-y: auto; position: sticky; top: 12px; display: flex; flex-direction: column; gap: 2px; }
    .cl-rail-i { display: flex; align-items: center; gap: 7px; border: 0; background: transparent; border-radius: 8px; padding: 5px 7px; font: inherit; font-size: 12px; color: var(--muted); cursor: pointer; text-align: left; width: 100%; }
    .cl-rail-i:hover { background: var(--soft); color: var(--ink); }
    .cl-rail-i.on { background: var(--accent-tint); color: var(--accent); font-weight: 650; }
    .cl-rail-i .n { min-width: 20px; text-align: right; font-variant-numeric: tabular-nums; color: var(--faint); font-size: 11px; }
    .cl-rail-i .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cl-rail-i .b { font-size: 10.5px; flex: none; }
    .cl-rail-i .lv { font-size: 9.5px; font-weight: 800; color: #fff; background: var(--danger); border-radius: 5px; padding: 0 5px; flex: none; }
    .cl-rail-i:focus-visible { outline: 2px solid var(--accent); }
    .cl-center { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
    .cl-stage { position: relative; width: 100%; overflow: hidden; border-radius: 10px; background: #0d1117; box-shadow: 0 10px 30px -18px rgba(10,14,30,.6); }
    .cl-stage.contain { height: 100%; display: flex; align-items: center; justify-content: center; border-radius: 0; }
    .cl-stage-inner { width: 960px; transform-origin: 0 0; font-family: Calibri, Carlito, Arial, sans-serif; color: #000; }   /* pptx-preview leaves theme-font text unstyled → it must not inherit the page font */
    .cl-stage.contain .cl-stage-inner { transform-origin: center center; flex: none; }
    .cl-stage-inner .pptx-preview-slide-wrapper { margin: 0 !important; box-shadow: none !important; }
    .cl-stage-msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 8px; color: #c9d1e0; font-size: 13.5px; padding: 16px; text-align: center; min-height: 200px; }
    .cl-stage-msg.err { color: #ffb4b4; }
    .cl-nav { display: flex; align-items: center; justify-content: center; gap: 12px; }
    .cl-nav-n { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); min-width: 110px; text-align: center; }
    .cl-notes { font-size: 13px; line-height: 1.55; white-space: pre-wrap; }
    .cl-notes b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); margin-bottom: 4px; }
    .cl-side { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
    .cl-side-h { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .cl-poll-i, .cl-run { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; display: flex; flex-direction: column; gap: 5px; background: var(--surface); }
    .cl-run.open { border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); }
    .cl-poll-t { display: flex; gap: 6px; font-size: 13px; line-height: 1.35; }
    .cl-poll-m { font-size: 11.5px; color: var(--faint); }
    .cl-poll-a { display: flex; gap: 6px; flex-wrap: wrap; }
    .cl-runs { display: flex; flex-direction: column; }
    .cl-form { border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line)); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 4px; background: var(--surface); }
    .cl-form .in { width: 100%; }
    .cl-form-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13.5px; }
    .cl-form-f { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
    .cl-types { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
    .cl-type { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 9px; font: inherit; cursor: pointer; color: var(--ink); }
    .cl-type:hover, .cl-type:focus-visible { border-color: var(--accent); background: var(--accent-tint); outline: none; }
    .cl-type .ic { font-size: 18px; }
    .cl-type b { font-size: 12.5px; }
    .cl-type span:last-child { font-size: 11px; color: var(--muted); line-height: 1.35; }
    .cl-opt { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
    .cl-opt .in { flex: 1; }
    .cl-opt-n { width: 22px; height: 22px; border-radius: 6px; background: var(--soft); border: 1px solid var(--line); display: inline-grid; place-items: center; font-size: 11px; font-weight: 800; color: var(--muted); flex: none; }
    .cl-inline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin-top: 6px; }
    .cl-inline .in.sm { width: 70px; }
    .cl-scale-set { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .cl-hint { font-size: 11.5px; color: var(--faint); }
    .cl-q { font-size: 15px; font-weight: 700; line-height: 1.35; margin: 4px 0 8px; }
    .cl-live-poll { border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); }
    .cl-wait { font-size: 13px; color: var(--muted); }
    .cl-choices { display: flex; flex-direction: column; gap: 6px; }
    .cl-choice { display: flex; align-items: center; gap: 9px; border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 11px; font: inherit; font-size: 13.5px; color: var(--ink); cursor: pointer; text-align: left; }
    .cl-choice:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
    .cl-choice.on { border-color: var(--accent); background: var(--accent-tint); }
    .cl-choice.on .cl-opt-n { background: var(--accent); color: #fff; border-color: var(--accent); }
    .cl-choice:focus-visible, .cl-scale-b:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .cl-scale { display: flex; gap: 5px; flex-wrap: wrap; }
    .cl-scale-b { flex: 1; min-width: 36px; height: 40px; border: 1.5px solid var(--line); background: var(--surface); border-radius: 9px; font: inherit; font-weight: 700; cursor: pointer; color: var(--ink); }
    .cl-scale-b.on { background: var(--accent); border-color: var(--accent); color: #fff; }
    .cl-scale-lab { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--faint); margin-top: 4px; }
    .cl-words { display: flex; flex-direction: column; gap: 6px; }
    .cl-words .in, .cl-answer textarea.in { width: 100%; }
    .cl-answer-f { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .cl-follow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--warn-bg); color: var(--ink); border-radius: 10px; padding: 8px 12px; margin-bottom: 10px; font-size: 13px; }
    .cl-bars { display: flex; flex-direction: column; gap: 6px; }
    .cl-bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto; gap: 3px 10px; font-size: 12.5px; }
    .cl-bar-l { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .cl-bar-l .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cl-bar-t { grid-column: 1; height: 9px; border-radius: 999px; background: var(--soft); overflow: hidden; }
    .cl-bar-t i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .4s ease; }
    .cl-bar-n { grid-column: 2; grid-row: 1 / span 2; align-self: center; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; min-width: 72px; text-align: right; }   /* fixed width → every bar track has the same length */
    .cl-bar.ok .cl-bar-t i { background: var(--ok); }
    .cl-bar.dim { opacity: .55; }
    .cl-ok { color: var(--ok); font-size: 11.5px; }

    /* ===== team room (course-team-room.js) — ClickUp-style workspace in Publify's own skin ===== */
    .tr-room { display: grid; grid-template-columns: 216px minmax(0, 1fr); gap: 14px; align-items: start; }
    .tr-rail { position: sticky; top: 12px; display: flex; flex-direction: column; gap: 10px;
      background: var(--surface-2, #12161f); border: 1px solid var(--line, #262c3a); border-radius: 12px; padding: 12px; }
    .tr-back { align-self: flex-start; }
    .tr-rail-team { display: flex; flex-direction: column; gap: 2px; }
    .tr-rail-team b { font-size: 15px; line-height: 1.25; }
    .tr-progress { display: flex; flex-direction: column; gap: 4px; }
    .tr-bar { height: 6px; border-radius: 999px; background: rgba(140, 150, 175, .22); overflow: hidden; }
    .tr-bar.sm { height: 4px; margin-top: 6px; }
    .tr-bar i { display: block; height: 100%; background: linear-gradient(90deg, #6d5efc, #38bdf8); border-radius: 999px;
      transition: width .25s ease; }
    .tr-mini-bar { display: inline-block; width: 46px; height: 5px; border-radius: 999px; vertical-align: middle;
      background: rgba(140, 150, 175, .22); overflow: hidden; }
    .tr-mini-bar i { display: block; height: 100%; background: #6d5efc; }
    .tr-nav { display: flex; flex-direction: column; gap: 2px; }
    .tr-nav-i { display: flex; align-items: center; gap: 9px; padding: 7px 9px; border-radius: 8px; cursor: pointer;
      background: none; border: 1px solid transparent; color: inherit; font: inherit; text-align: left; }
    .tr-nav-i .ic { width: 18px; text-align: center; }
    .tr-nav-i:hover { background: rgba(140, 150, 175, .12); }
    .tr-nav-i.on { background: rgba(109, 94, 252, .16); border-color: rgba(109, 94, 252, .5); font-weight: 600; }
    .tr-rail-people { display: flex; flex-direction: column; gap: 3px; border-top: 1px solid var(--line, #262c3a); padding-top: 8px; }
    .tr-person { display: flex; align-items: center; gap: 7px; padding: 4px 6px; border-radius: 8px; cursor: pointer;
      background: none; border: 1px solid transparent; color: inherit; font: inherit; text-align: left; min-width: 0; }
    .tr-person:hover { background: rgba(140, 150, 175, .12); }
    .tr-person.on { border-color: var(--acc); }
    .tr-person-n { font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .tr-ro { align-self: flex-start; }
    .tr-main { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
    .tr-goalbar { display: flex; align-items: center; gap: 10px; background: var(--surface-2, #12161f);
      border: 1px solid var(--line, #262c3a); border-radius: 12px; padding: 8px 12px; }
    .tr-goal-l { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; white-space: nowrap; }
    .tr-goalbar .in { flex: 1; min-width: 0; background: transparent; border-color: transparent; font-size: 14px; }
    .tr-goalbar .in:focus { border-color: var(--acc); background: var(--surface, #0f1218); }
    .tr-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .tr-search { min-width: 220px; flex: 1; max-width: 340px; }
    .tr-toggle { padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line, #262c3a); background: none;
      color: inherit; font: inherit; font-size: 12.5px; cursor: pointer; }
    .tr-toggle:hover { border-color: var(--acc); }
    .tr-toggle.on { background: rgba(109, 94, 252, .16); border-color: var(--acc); }

    .tr-board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; align-items: start; }
    .tr-col { background: var(--surface-2, #12161f); border: 1px solid var(--line, #262c3a); border-radius: 12px;
      padding: 8px; min-height: 120px; transition: border-color .15s, background .15s; }
    .tr-col.over { border-color: var(--acc); background: rgba(109, 94, 252, .08); }
    .tr-col-h { display: flex; align-items: center; gap: 7px; padding: 2px 4px 8px; }
    .tr-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
    .tr-dot.todo { background: #8b93a7; } .tr-dot.doing { background: #38bdf8; }
    .tr-dot.review { background: #f5a524; } .tr-dot.done { background: #3ecf8e; }
    .tr-count { margin-left: auto; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums;
      background: rgba(140, 150, 175, .14); border-radius: 999px; padding: 0 7px; }
    .tr-card { background: var(--surface, #1a2030); border: 1px solid var(--line, #262c3a); border-radius: 10px;
      padding: 9px; margin-bottom: 7px; cursor: pointer; transition: transform .12s, border-color .12s, box-shadow .12s; }
    .tr-card:hover { border-color: var(--acc); transform: translateY(-1px); box-shadow: 0 6px 16px rgba(0, 0, 0, .25); }
    .tr-card:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
    .tr-card.dragging { opacity: .45; }
    .tr-card.done .tr-card-t { text-decoration: line-through; opacity: .75; }
    .tr-card-top { display: flex; align-items: flex-start; gap: 7px; }
    .tr-card-t { flex: 1; font-size: 13.5px; line-height: 1.35; }
    .tr-prio { font-size: 10px; line-height: 1; }
    .tr-card-m { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
    /* emoji glyphs inflate the line box, so the chips get an explicit height instead of padding-driven one */
    .tr-chip { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 8px; border-radius: 999px;
      border: 1px solid var(--line, #262c3a); color: var(--muted); font-size: 11px; line-height: 1; white-space: nowrap; }
    .tr-chip.ok { border-color: #3ecf8e; color: #3ecf8e; }
    .tr-chip.acc { border-color: var(--acc); color: var(--acc); }
    .tr-chip.due.soon { border-color: #f5a524; color: #f5a524; }
    .tr-chip.due.late { border-color: #f5576c; color: #f5576c; }
    .tr-chip.status.todo { color: #8b93a7; } .tr-chip.status.doing { color: #38bdf8; border-color: #38bdf8; }
    .tr-chip.status.review { color: #f5a524; border-color: #f5a524; } .tr-chip.status.done { color: #3ecf8e; border-color: #3ecf8e; }
    .tr-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .tr-tag { display: inline-flex; align-items: center; height: 18px; padding: 0 7px; border-radius: 6px;
      background: rgba(109, 94, 252, .16); color: #b9b0ff; font-size: 10.5px; line-height: 1; white-space: nowrap; }
    .tr-empty { color: var(--muted); font-size: 12px; margin: 6px 4px; }
    .tr-addbtn { width: 100%; padding: 6px; border-radius: 8px; border: 1px dashed var(--line, #262c3a); background: none;
      color: var(--muted); font: inherit; font-size: 12.5px; cursor: pointer; }
    .tr-addbtn:hover { border-color: var(--acc); color: inherit; }
    .tr-quick { display: flex; gap: 6px; }
    .tr-quick .in { flex: 1; min-width: 0; }
    .tr-av { width: 24px; height: 24px; border-radius: 50%; display: inline-grid; place-items: center; flex: none;
      background: linear-gradient(135deg, #3b3f58, #262c3a); font-size: 10.5px; font-weight: 700; }
    .tr-av.sm { width: 21px; height: 21px; font-size: 9.5px; }
    .tr-av.on { outline: 2px solid var(--acc); }

    .tr-list { display: flex; flex-direction: column; gap: 10px; }
    .tr-list-h { display: flex; align-items: center; gap: 8px; }
    .tr-lgroup { background: var(--surface-2, #12161f); border: 1px solid var(--line, #262c3a); border-radius: 12px; overflow: hidden; }
    .tr-lgroup-h { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: rgba(140, 150, 175, .07); }
    .tr-lrow { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--line, #262c3a);
      cursor: pointer; min-width: 0; }
    .tr-lrow:hover { background: rgba(140, 150, 175, .08); }
    .tr-lrow-t { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tr-lrow .sp { flex: 1; }

    .tr-cal-wrap { display: flex; flex-direction: column; gap: 10px; }
    .tr-cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
    .tr-day { background: var(--surface-2, #12161f); border: 1px solid var(--line, #262c3a); border-radius: 10px;
      padding: 8px; min-height: 110px; display: flex; flex-direction: column; gap: 5px; }
    .tr-day.today { border-color: var(--acc); }
    .tr-day-h { display: flex; flex-direction: column; }
    .tr-day-h b { font-size: 12px; text-transform: capitalize; }
    .tr-mini { display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; font: inherit; font-size: 12px;
      background: var(--surface, #1a2030); border: 1px solid var(--line, #262c3a); border-radius: 8px; padding: 5px 7px;
      color: inherit; cursor: pointer; }
    .tr-mini:hover { border-color: var(--acc); }
    .tr-mini.done { opacity: .7; text-decoration: line-through; }
    .tr-late { border-color: #f5576c; }
    .tr-late-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .tr-late-list .tr-mini { width: auto; }

    .tr-drawer-wrap { position: fixed; inset: 0; background: rgba(6, 8, 13, .55); z-index: 1250; display: flex; justify-content: flex-end; }
    .tr-drawer { width: min(560px, 100%); background: var(--surface, #12161f); border-left: 1px solid var(--line, #262c3a);
      display: flex; flex-direction: column; height: 100%; }
    .tr-dr-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line, #262c3a); }
    .tr-dr-head .sp { flex: 1; }
    .tr-statuses button { font-size: 12px; }
    .tr-dr-body { padding: 14px; overflow: auto; display: flex; flex-direction: column; gap: 6px; }
    .tr-title { font-size: 17px; font-weight: 600; background: transparent; border-color: transparent; padding-left: 0; }
    .tr-title:focus { border-color: var(--acc); background: var(--surface-2, #0f1218); padding-left: 10px; }
    .tr-dr-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin: 6px 0; }
    .tr-check, .tr-ev, .tr-comments { margin-top: 14px; border-top: 1px solid var(--line, #262c3a); padding-top: 10px; }
    .tr-check-h { display: flex; align-items: center; gap: 8px; }
    .tr-check-i { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 13px; }
    .tr-check-i.on span { text-decoration: line-through; color: var(--muted); }
    .tr-check-i span { flex: 1; }
    .tr-check-new { display: flex; gap: 6px; margin-top: 6px; }
    .tr-check-new .in { flex: 1; }
    .tr-x { background: none; border: 0; color: var(--muted); font-size: 16px; line-height: 1; cursor: pointer; padding: 0 4px; }
    .tr-x:hover { color: #f5576c; }
    .tr-files { list-style: none; margin: 6px 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
    .tr-files li { display: flex; align-items: center; gap: 8px; }
    .tr-file { background: none; border: 0; color: inherit; font: inherit; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; min-width: 0; }
    .tr-fname { text-decoration: underline; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 210px; }
    .tr-ev-add { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
    .tr-ev-add .in.sm { flex: 1; min-width: 150px; }
    .tr-cmt-list { display: flex; flex-direction: column; gap: 10px; margin: 8px 0; }
    .tr-cmt { display: flex; gap: 8px; }
    .tr-cmt-b { flex: 1; min-width: 0; }
    .tr-cmt-h { display: flex; align-items: center; gap: 8px; }
    .tr-cmt-b p { margin: 2px 0 0; font-size: 13px; white-space: pre-wrap; }
    .tr-cmt-new { display: flex; gap: 6px; align-items: flex-end; }
    .tr-cmt-new .in { flex: 1; }

    .tr-cer { display: flex; flex-direction: column; gap: 10px; }
    .tr-cer-h { display: flex; align-items: center; gap: 8px; }
    .tr-cer-h .sp { flex: 1; }
    .tr-cer-form { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
    .tr-cer-form .btn { align-self: flex-start; margin-top: 6px; }
    .tr-cer-list { display: flex; flex-direction: column; gap: 8px; }
    .tr-cer-who { display: flex; align-items: center; gap: 6px; }
    .tr-cer-p { margin: 2px 0 0; font-size: 13px; }
    .tr-stats-wrap { overflow-x: auto; margin-top: 8px; }
    .tr-stats-wrap .tr-n { text-align: right; font-variant-numeric: tabular-nums; }
    .tr-who { display: inline-flex; align-items: center; gap: 7px; }
    .tr-idle td { opacity: .72; }
    .tr-ov { margin-bottom: 4px; }

    /* thumbnails, chat, docs, dashboard, overview cards */
    .tr-thumb { width: 100%; max-height: 120px; object-fit: cover; border-radius: 8px; margin-top: 7px; cursor: pointer;
      background: rgba(140, 150, 175, .12); display: block; }
    .tr-files .tr-thumb { width: 44px; height: 44px; margin: 0; flex: none; }
    .tr-thumb.big { max-height: 132px; margin: 0 0 6px; }

    .tr-chat { display: flex; flex-direction: column; gap: 10px; height: min(70vh, 640px); }
    .tr-chat-head { display: flex; flex-direction: column; gap: 2px; }
    .tr-chat-head .co-note { max-width: 80ch; }
    .tr-chat-log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 12px;
      background: var(--surface-2, #12161f); border: 1px solid var(--line, #262c3a); border-radius: 12px; }
    .tr-msg { display: flex; gap: 9px; }
    .tr-msg-b { flex: 1; min-width: 0; }
    .tr-msg.mine .tr-msg-b { background: rgba(109, 94, 252, .1); border-radius: 10px; padding: 6px 9px; }
    .tr-msg-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .tr-msg-b p { margin: 2px 0 0; font-size: 13.5px; white-space: pre-wrap; }
    .tr-msg-a { margin-top: 4px; }
    .tr-msg-more { background: none; border: 0; color: var(--muted); font: inherit; font-size: 11.5px; cursor: pointer; padding: 0; }
    .tr-msg-more:hover { color: var(--acc); }
    .tr-msg-acts { display: inline-flex; gap: 5px; flex-wrap: wrap; }
    .tr-chat-new { display: flex; gap: 8px; align-items: flex-end; }
    .tr-chat-new .in { flex: 1; }

    .tr-docs { display: flex; flex-direction: column; gap: 10px; }
    .tr-docs-head { display: flex; align-items: flex-start; gap: 8px; flex-wrap: wrap; }
    .tr-docs-head .sp { flex: 1; }
    .tr-docs-head .co-note { margin: 2px 0 0; max-width: 78ch; }
    .tr-docs-link { display: flex; gap: 6px; }
    .tr-docs-link .in { flex: 1; }
    .tr-doc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
    .tr-doc { position: relative; background: var(--surface-2, #12161f); border: 1px solid var(--line, #262c3a);
      border-radius: 10px; padding: 9px; display: flex; flex-direction: column; gap: 3px; }
    .tr-doc-ic { font-size: 22px; }
    .tr-doc-n { background: none; border: 0; padding: 0; color: inherit; font: inherit; font-size: 13px; text-align: left;
      cursor: pointer; text-decoration: underline; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tr-doc-x { position: absolute; top: 4px; right: 4px; }

    .tr-dash { display: flex; flex-direction: column; gap: 10px; }
    .tr-dash-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
    .tr-kpi { background: var(--surface-2, #12161f); border: 1px solid var(--line, #262c3a); border-radius: 12px;
      padding: 11px 13px; display: flex; flex-direction: column; gap: 2px; }
    .tr-kpi b { font-size: 23px; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .tr-kpi span { font-size: 12px; color: var(--muted); }
    .tr-kpi.ok b { color: #3ecf8e; } .tr-kpi.acc b { color: var(--acc); }
    .tr-stack { display: flex; height: 22px; border-radius: 999px; overflow: hidden; margin: 10px 0 6px;
      background: rgba(140, 150, 175, .14); }
    .tr-stack-i { display: grid; place-items: center; font-size: 11px; color: #0d1016; font-weight: 700; }
    .tr-stack-i.todo { background: #8b93a7; } .tr-stack-i.doing { background: #38bdf8; }
    .tr-stack-i.review { background: #f5a524; } .tr-stack-i.done { background: #3ecf8e; }
    .tr-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
    .tr-leg { display: inline-flex; align-items: center; gap: 5px; }
    .tr-dash-rows { display: flex; flex-direction: column; gap: 7px; margin-top: 8px; }
    .tr-dash-row { display: grid; grid-template-columns: minmax(130px, 1.2fr) minmax(90px, 1fr) auto auto; gap: 10px; align-items: center; }
    .tr-dash-bars { display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: rgba(140, 150, 175, .14); }
    .tr-dbar.done { background: #3ecf8e; } .tr-dbar.doing { background: #38bdf8; } .tr-dbar.todo { background: #8b93a7; }
    .tr-dash-n { font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .tr-lead { display: flex; flex-direction: column; gap: 4px; margin-top: 12px; border-top: 1px solid var(--line, #262c3a); padding-top: 10px; }
    .tr-lead-i { display: flex; align-items: center; gap: 8px; padding: 3px 6px; border-radius: 8px; }
    .tr-lead-i.me { background: rgba(109, 94, 252, .12); }
    .tr-lead-n { width: 20px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .tr-lead-t { flex: 1; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* lecturer overview — cards instead of a wide table */
    .tr-repo { display: flex; flex-direction: column; gap: 10px; }
    .tr-repo-h { display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
    .tr-repo-h .sp { flex: 1; }
    .tr-repo-h .co-note { margin: 2px 0 0; max-width: 78ch; }
    .tr-repo-row { display: flex; gap: 8px; }
    .tr-repo-row .in { flex: 1; min-width: 0; }
    .tr-repo-me { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 10px;
      border-top: 1px solid var(--line, #262c3a); padding-top: 10px; }
    .tr-repo-me .in.sm { width: 170px; }
    .tr-repo-msg { margin: 6px 0 0; font-size: 12.5px; color: var(--acc); }
    .tr-commits { display: flex; flex-direction: column; margin-top: 8px; }
    .tr-commit { display: grid; grid-template-columns: 66px minmax(0, 1fr) auto auto; gap: 10px; align-items: center;
      padding: 7px 4px; border-top: 1px solid var(--line, #262c3a); color: inherit; text-decoration: none; font-size: 13px; }
    .tr-commit:hover { background: rgba(140, 150, 175, .08); }
    .tr-c-sha { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; color: var(--muted); }
    .tr-c-msg { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tr-c-who { font-size: 12px; white-space: nowrap; }
    .tr-c-at { font-size: 11.5px; white-space: nowrap; }
    @media (max-width: 720px) {
      .tr-commit { grid-template-columns: 56px minmax(0, 1fr); }
      .tr-c-who, .tr-c-at { grid-column: 2; }
    }
    .tr-ovh { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
    .tr-ovh .sp { flex: 1; }
    .tr-ov-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
    .tr-ovc { background: var(--surface-2, #12161f); border: 1px solid var(--line, #262c3a); border-radius: 12px;
      padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .tr-ovc.risk { border-color: #f5576c; }
    .tr-ovc-h { display: flex; align-items: center; gap: 8px; }
    .tr-ovc-h b { font-size: 14.5px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tr-ring { --p: 0; width: 46px; height: 46px; flex: none; border-radius: 50%;
      background: conic-gradient(#3ecf8e calc(var(--p) * 1%), rgba(140, 150, 175, .18) 0);
      display: grid; place-items: center; font-size: 11px; font-weight: 700; }
    .tr-ring span { width: 34px; height: 34px; border-radius: 50%; background: var(--surface-2, #12161f); display: grid; place-items: center; }
    .tr-ovc-m { display: flex; flex-wrap: wrap; gap: 5px; }
    .tr-ovc-f { display: flex; align-items: center; gap: 8px; }
    .tr-ovc-f .sp { flex: 1; }

    @media (max-width: 1000px) {
      .tr-room { grid-template-columns: 1fr; }
      .tr-rail { position: static; flex-direction: row; flex-wrap: wrap; align-items: center; }
      .tr-nav { flex-direction: row; flex-wrap: wrap; }
      .tr-rail-people { flex-direction: row; flex-wrap: wrap; border-top: 0; padding-top: 0; }
      .tr-progress { min-width: 150px; }
      .tr-board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .tr-cal { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 560px) {
      .tr-board, .tr-cal { grid-template-columns: 1fr; }
      .tr-search { max-width: none; }
    }

    /* ===== course feed (course-feed.js) ===== */
    .cf-wrap { display: flex; flex-direction: column; gap: 10px; }
    .cf-top { display: flex; align-items: flex-start; gap: 8px; flex-wrap: wrap; }
    .cf-top h3 { margin: 0 0 2px; }
