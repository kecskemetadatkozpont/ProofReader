<!DOCTYPE html>
<html lang="hu">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Publify — Kurzus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --surface:#fff; --surface-2:#f5f6f9; --surface-3:#fafbfc; --accent-tint:#eef0ff; --ok:#15803d; --ok-bg:#e7f6ee; --warn:#b45309; --warn-bg:#fdf6e3; --danger:#b42318; --danger-bg:#fdeef0;
      --accent: #4f46e5; --accent-d: #4338ca; --ink: #1a2030; --muted: #5b6473; --faint: #8a92a0;
      --line: #e6e8ee; --soft: #f5f6f9; --softer: #fafbfc; --paper: #fff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { background: var(--softer); color: var(--ink); font-family: 'IBM Plex Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: var(--accent); text-decoration: none; }
    .mk { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: linear-gradient(135deg, #6366f1, #d946ef); box-shadow: 0 4px 12px rgba(79,70,229,.34); flex: none; }
    .mk span { width: 12px; height: 12px; border-top: 2.4px solid #fff; border-left: 2.4px solid #fff; border-radius: 2px 0 0 0; transform: rotate(45deg); margin-top: 3px; }
    .center { min-height: 80vh; display: flex; align-items: center; justify-content: center; }
    .center .box { text-align: center; max-width: 440px; padding: 0 18px; } .center .mk { width: 52px; height: 52px; margin: 0 auto 16px; }
    .center h1 { font-size: 20px; margin: 0 0 6px; } .center p { font-size: 13.5px; color: var(--muted); margin: 0 0 20px; line-height: 1.55; }
    .soon { background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; padding: 28px; text-align: center; color: var(--muted); line-height: 1.55; }
    .sp { flex: 1; }

    /* shared button / chip / segmented vocabulary (mirrors Kanban.html / Research.html) */
    .btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; font-family: inherit; font-size: 13px; font-weight: 600; color: var(--ink); cursor: pointer; white-space: nowrap; }
    .btn:hover { border-color: var(--accent); } .btn:disabled { opacity: .55; cursor: default; }
    .btn.pri { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn.sm { padding: 4px 10px; font-size: 12px; border-radius: 8px; }
    .btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 30%, transparent); }
    .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; background: var(--surface); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .chip.ok { color: var(--ok); background: var(--ok-bg); border-color: transparent; }
    .chip.warn { color: var(--warn); background: var(--warn-bg); border-color: transparent; }
    .chip.danger { color: var(--danger); background: var(--danger-bg); border-color: transparent; }
    .chip.acc { color: var(--accent); background: var(--accent-tint); border-color: transparent; }
    button.chip { cursor: pointer; font-family: inherit; }
    button.chip:hover { border-color: var(--accent); color: var(--accent); }
    .seg { display: inline-flex; background: var(--soft); border: 1px solid var(--line); border-radius: 10px; padding: 2px; flex-wrap: wrap; }
    .seg button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 12.5px; font-weight: 600; padding: 6px 12px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
    .seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(20,26,32,.08); }
    .in { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 9px; padding: 8px 10px; font: inherit; font-size: 13px; }
    .in:focus { outline: none; border-color: var(--accent); }
    textarea.in { resize: vertical; width: 100%; }
    .form-l { font-size: 11px; font-weight: 700; color: var(--faint); text-transform: uppercase; letter-spacing: .05em; margin: 8px 0 3px; }
    /* determinate progress bar fallback (theme.js also ships .pr-bar) */
    .pr-bar { height: 7px; border-radius: 999px; background: var(--soft); overflow: hidden; }
    .pr-bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .25s ease; }

    /* course home + management (create course, members) */
    .muted { color: var(--muted); }
    .in.sm { padding: 4px 8px; font-size: 12.5px; border-radius: 8px; }
    .home-h { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin: 6px 0 16px; }
    .home-h h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -.3px; }
    .home-h p { margin: 0; font-size: 13.5px; color: var(--muted); }
    .course-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .course-card { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 14px 16px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; min-height: 132px; transition: border-color .12s, box-shadow .12s; }
    .course-card:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); box-shadow: 0 8px 22px -14px rgba(20,24,40,.35); }
    .course-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .course-card.off { opacity: .7; }
    .cc-top { display: flex; gap: 6px; flex-wrap: wrap; min-height: 22px; }
    .cc-t { font-size: 15.5px; font-weight: 700; line-height: 1.3; letter-spacing: -.1px; text-wrap: balance; }
    .cc-d { font-size: 12.5px; color: var(--muted); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .cc-meta { margin-top: auto; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
    .join-card { max-width: 520px; }
    .join-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .join-row .in { flex: 1; min-width: 160px; }
    .join-code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 15px; font-weight: 700; letter-spacing: .08em; background: var(--soft); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; }
    .co-note { font-size: 12.5px; color: var(--muted); line-height: 1.5; margin: 6px 0 10px; }
    .co-err { font-size: 12.5px; color: var(--danger); margin: 8px 0 0; }
    .co-scrim { position: fixed; inset: 0; z-index: 1250; background: rgba(8,10,16,.45); display: flex; align-items: center; justify-content: center; padding: 16px; }
    .co-modal { width: min(560px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 30px 80px rgba(10,14,30,.35); display: flex; flex-direction: column; }
    .co-mh { display: flex; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); font-size: 15px; }
    .co-x { margin-left: auto; border: 0; background: var(--soft); color: var(--muted); width: 30px; height: 30px; border-radius: 8px; font-size: 18px; cursor: pointer; }
    .co-mb { padding: 14px 18px; display: flex; flex-direction: column; gap: 2px; }
    .co-mb .in { width: 100%; }
    .co-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    @media (max-width: 560px) { .co-row { grid-template-columns: 1fr; } }
    .co-mf { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); }
    .members { align-items: start; }
    .mem-col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
    .mem-table { padding-bottom: 2px; }
    .mem-h { display: flex; align-items: center; gap: 8px; padding: 11px 12px 4px; font-size: 13.5px; }
    .mem-empty { padding: 8px 12px 14px; font-size: 12.5px; color: var(--faint); }
    .mem-table td.act { text-align: right; }
    .mem-table td.cell-wrap { white-space: normal; min-width: 140px; }
    .mem-table tbody tr { cursor: default; }
    .add-card h3, .code-card h3 { margin: 0 0 8px; font-size: 14.5px; }
    .add-bar { display: flex; flex-direction: column; gap: 8px; }
    .add-bar .in { width: 100%; }
    .pick-list { display: flex; flex-direction: column; gap: 3px; max-height: 340px; overflow-y: auto; margin: 10px 0; }
    .pick-row { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 9px; border: 1px solid transparent; cursor: pointer; }
    .pick-row:hover { background: var(--soft); }
    .pick-row.on { background: var(--accent-tint); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
    .pick-row.dis { cursor: default; opacity: .75; }
    .pick-row input { width: 15px; height: 15px; margin: 0; accent-color: var(--accent); flex: none; }
    .pick-row:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 1px; }
    .pick-t { display: flex; flex-direction: column; min-width: 0; flex: 1; font-size: 13px; }
    .pick-t .muted { font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .add-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px; }

    /* page frame */
    .co-wrap { max-width: 1500px; margin: 0 auto; padding: 18px 22px 40px; }
    .labtop { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); margin-bottom: 12px; }
    .labtop h2 { font-size: 17px; font-weight: 700; margin: 0; letter-spacing: -.2px; }
    .credits { display: flex; gap: 14px; flex-wrap: wrap; }
    .cr { min-width: 104px; }
    .cr .l { display: flex; justify-content: space-between; gap: 8px; font-size: 10.5px; font-weight: 700; color: var(--faint); letter-spacing: .05em; text-transform: uppercase; margin-bottom: 3px; }
    .cr .l b { color: var(--muted); font-variant-numeric: tabular-nums; }

    /* three-pane lab layout: lecture rail | notebook | MCP panel (design_mockup screen 1) */
    .labgrid { display: grid; grid-template-columns: 230px minmax(0, 1fr) 380px; gap: 12px; align-items: start; }
    @media (max-width: 1180px) { .labgrid { grid-template-columns: 200px minmax(0, 1fr); } .mcp { grid-column: 1 / -1; position: static; max-height: none; } }
    @media (max-width: 820px) { .labgrid { grid-template-columns: 1fr; } .rail { position: static; max-height: none; } }

    .rail { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 10px 8px; position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; }
    .rail h3 { font-size: 10.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--faint); margin: 4px 8px 8px; }
    .rl { display: flex; align-items: center; gap: 9px; padding: 7px 9px; border-radius: 9px; font-size: 12.5px; color: var(--muted); cursor: pointer; border: 0; background: transparent; width: 100%; text-align: left; font-family: inherit; }
    .rl:hover { background: var(--soft); color: var(--ink); }
    .rl .st { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 10.5px; flex: none; border: 1.5px solid var(--line); color: var(--faint); font-variant-numeric: tabular-nums; font-weight: 700; }
    .rl.done .st { background: var(--ok-bg); border-color: transparent; color: var(--ok); }
    .rl.now { background: var(--accent-tint); color: var(--accent); font-weight: 600; }
    .rl.now .st { background: var(--accent); border-color: transparent; color: #fff; }
    .rl.dim { opacity: .55; }
    .rl .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .notebook { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
    .co-card { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 14px 16px; }
    .co-card h3 { margin: 0; font-size: 14.5px; font-weight: 700; }
    .lab-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .lab-n { width: 24px; height: 24px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 11.5px; font-weight: 800; border: 1.5px solid var(--line); color: var(--faint); font-variant-numeric: tabular-nums; }
    .md { font-size: 13.5px; line-height: 1.6; color: var(--ink); }
    .md p { margin: 6px 0; } .md ul, .md ol { margin: 6px 0; padding-left: 20px; } .md li { margin: 3px 0; }
    .md h1, .md h2, .md h3, .md h4 { font-size: 14px; margin: 12px 0 4px; }
    .md code { background: var(--soft); border: 1px solid var(--line); border-radius: 5px; padding: 0 4px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    .md pre { background: var(--soft); border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; overflow: auto; }
    .md pre code { border: 0; background: transparent; padding: 0; }
    .md a { word-break: break-all; }
    .sub-box { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); display: flex; flex-direction: column; gap: 7px; }
    .sub-box .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .feedback { margin-top: 10px; background: var(--accent-tint); border: 1px solid color-mix(in srgb, var(--accent) 22%, transparent); border-radius: 10px; padding: 9px 12px; font-size: 12.5px; }

    /* embedded MCP caller panel (research-chat panel fork, design_mockup screen 1 right side) */
    .mcp { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); display: flex; flex-direction: column; min-height: 420px; max-height: calc(100vh - 24px); position: sticky; top: 12px; overflow: hidden; }
    .mcp-h { display: flex; align-items: center; gap: 8px; padding: 11px 13px; border-bottom: 1px solid var(--line); font-size: 12.5px; font-weight: 700; flex-wrap: wrap; }
    .mcp-h .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
    .mcp-sub { font-size: 11.5px; color: var(--faint); padding: 7px 13px; border-bottom: 1px solid var(--line); }
    .mcp-b { flex: 1; overflow: auto; padding: 13px; display: flex; flex-direction: column; gap: 10px; min-height: 160px; }
    .mcp-empty { font-size: 12.5px; color: var(--faint); line-height: 1.5; }
    .msg { max-width: 94%; border-radius: 12px; padding: 8px 11px; font-size: 12.5px; line-height: 1.5; }
    .msg.user { align-self: flex-end; background: var(--accent-tint); color: var(--ink); border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent); white-space: pre-wrap; }
    .msg.ai { align-self: flex-start; background: var(--soft); border: 1px solid var(--line); }
    .msg.err { align-self: stretch; max-width: 100%; background: var(--danger-bg); color: var(--danger); border: 1px solid color-mix(in srgb, var(--danger) 25%, transparent); }
    .tool { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; }
    .tool .th { display: flex; align-items: center; gap: 8px; padding: 7px 11px; background: var(--soft); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: var(--muted); flex-wrap: wrap; }
    .tool .th .tk { color: var(--accent); font-weight: 700; }
    .tool .tb { padding: 9px 11px; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
    .tool .tb .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
    .co-media { max-width: 100%; border-radius: 9px; display: block; }
    .mcp-actions { display: flex; gap: 8px; padding: 11px 13px; border-top: 1px solid var(--line); align-items: flex-end; }
    .mcp-actions textarea { flex: 1; }
    .mcp-cost { font-size: 11px; color: var(--muted); padding: 0 13px 11px; font-variant-numeric: tabular-nums; }
    .pr-skel { background: var(--soft); border-radius: 9px; }

    /* instructor console (design_mockup screen 3) */
    .teach { display: flex; flex-direction: column; gap: 12px; }
    .subgrid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 12px; align-items: start; }
    @media (max-width: 1000px) { .subgrid { grid-template-columns: 1fr; } }
    .subtable { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
    .subtable table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
    .subtable th { text-align: left; font-size: 10px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--faint); padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    .subtable td { padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; vertical-align: middle; }
    .subtable tr:last-child td { border-bottom: 0; }
    .subtable tbody tr { cursor: pointer; }
    .subtable tbody tr:hover td { background: var(--soft); }
    .subtable tr.sel td { background: var(--accent-tint); }
    .stu { display: flex; align-items: center; gap: 8px; font-weight: 600; }
    .stu i { width: 20px; height: 20px; border-radius: 50%; flex: none; font-style: normal; display: grid; place-items: center; font-size: 9px; font-weight: 800; color: #fff; background: var(--accent); }
    .prompt-cell { max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: var(--muted); }
    .rub { display: flex; align-items: center; gap: 9px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
    .rub:last-of-type { border-bottom: 0; }
    .rub .pts { margin-left: auto; display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
    .rub .pts button { width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; font-size: 12px; line-height: 1; }
    .rub .pts button:hover { border-color: var(--accent); color: var(--ink); }
    .rub .pts b { min-width: 48px; text-align: center; font-size: 12.5px; }
    .gtotal { display: flex; align-items: center; justify-content: space-between; margin-top: 11px; font-size: 13px; }
    .gtotal b { font-size: 19px; font-variant-numeric: tabular-nums; }
  </style>
